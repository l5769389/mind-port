<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindPort Browser Viewer</title>
    <style>
      html, body, #viewer {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      .toolbar {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 2;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        font: 14px/1.4 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <label class="toolbar">
      Open
      <input id="file" type="file" accept=".xmind,.pos,.json" />
    </label>
    <div id="viewer"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
